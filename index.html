<!doctype html>

<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#dashboard"><img src="img/logo-musashi.png" alt="" onerror="this.remove()"><span>PSP-<b>Dashboard</b></span></a>
    <nav id="nav">
      <a href="#dashboard">Ringkasan</a>
      <a href="#proyek">Proyek</a>
      <a href="#loading">Loading MP</a>
      <a href="#gudang">Gudang</a>
    </nav>
    <button class="btn pri" id="install" hidden style="padding:5px 10px;font-size:12.5px">Pasang di HP</button>
    <span id="status" class="status">memuat…</span>
  </div>
</header>
<div id="demo" class="demo" hidden>Mode demo: data contoh dari <code>data/seed.json</code>, perubahan tidak tersimpan. Isi <code>API_URL</code> di <code>config.js</code> untuk memakai Google Sheet.</div>

<script src="config.js"></script>
